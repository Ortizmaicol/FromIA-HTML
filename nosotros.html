<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosotros - FormAI</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <!-- Tus estilos personalizados (SIEMPRE DESPUÉS DE BOOTSTRAP) -->
    <link rel="stylesheet" href="Styles/Styles.css" />
</head>
<body class="auth-body">

    <!-- Contenedor de Navbar -->
    <div id="navbar-container"></div>

    <!-- Contenido -->
    <main class="container py-5 text-white">
      <h1>Sección Nosotros</h1>
    </main>

    <script>
  // Contenedor donde se montará la barra aislada
  const container = document.getElementById('navbar-container');
  const shadow = container.attachShadow({ mode: 'open' });

  // Cargar el HTML y el CSS dentro del aislamiento
  Promise.all([
    fetch('navbar.html').then(res => res.text()),
    fetch('Styles/Styles.css').then(res => res.text())
  ]).then(([html, css]) => {
    // Inyectamos los estilos y la estructura dentro del Shadow DOM
    shadow.innerHTML = `
      <style>${css}</style>
      ${html}
    `;
  }).catch(err => console.error('Error cargando el navbar aislado:', err));
</script>
</body>
</html>
