<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Página No Encontrada</title>
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Estilos base -->
  <link rel="stylesheet" href="Styles/Styles.css" />

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .error-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .error-code {
      font-size: 7rem;
      font-weight: 900;
      background: linear-gradient(135deg, #336699 0%, #6f42c1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      line-height: 1;
    }

    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem;
    }

    .error-desc {
      color: #888;
      max-width: 450px;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .btn-error-back {
      background-color: #336699;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-error-back:hover {
      background-color: #244b73;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Navbar Modular -->
  <div id="navbar-container"></div>

  <!-- Vista principal de Error -->
  <main class="error-container">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Página no encontrada</h2>
    <p class="error-desc">
      Lo sentimos, la sección de contáctanos no está disponible en este momento o fue reubicada.
    </p>
    <a href="index.html" class="btn-error-back">
      &larr; Volver al Inicio
    </a>
  </main>

  <!-- Script para cargar Navbar -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const container = document.getElementById('navbar-container');
      if (container) {
        const shadow = container.attachShadow({ mode: 'open' });

        Promise.all([
          fetch('navbar.html').then(res => res.text()),
          fetch('Styles/Styles.css').then(res => res.text())
        ]).then(([html, css]) => {
          shadow.innerHTML = `
            <style>${css}</style>
            ${html}
          `;

          shadow.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
              const href = link.getAttribute('href');
              if (href && href !== '#') {
                e.preventDefault();
                window.top.location.href = href;
              }
            });
          });

        }).catch(err => console.error('Error cargando el navbar:', err));
      }
    });
  </script>
</body>
</html>
