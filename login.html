<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormAI - IniciarSesión / Registrarse</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Estilos de la landing + Auth -->
    <link rel="stylesheet" href="Styles.css" />
    <link rel="stylesheet" href="css/auth-dark.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  </head>
  <body class="auth-body">
    <!-- Navbar similar a index_2 -->
    <nav class="Encabezado">
      <div style="margin-left: 30px;">
        <a href="index_2.html">
          <img
            class="Encabezado-Img"
            src="/Img/IconoFormAIDark.avif"
            alt="IconoFormAI"
          />
        </a>
      </div>
      <div class="Encabezado-navegacion">
        <p class="Encabezado-navegacion-Title">Form-AI</p>
        <div class="Encabezado-navegacion-Menu">
          <div class="Menu-Item">
            <a href="index_2.html">Inicio</a>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </div>
      </div>
    </nav>

    <main class="auth-wrapper container py-5">
      <!-- Encabezado Central -->
      <div class="text-center mb-4">
        <h1 class="auth-main-title">IniciarSesion/Registrarse</h1>
        <p class="auth-subtitle">
          con el botón de selección puedes elegir si quieres iniciar sesión o
          crear una nueva cuenta
        </p>

        <!-- Toggle Switch -->
        <div
          class="auth-toggle-container d-inline-flex align-items-center mt-3"
        >
          <span
            class="toggle-label me-3"
            id="lblLogin"
            style="color: #fff; font-weight: 600;"
            >IniciarSesion</span
          >
          <div class="form-check form-switch custom-switch m-0">
            <input
              class="form-check-input"
              type="checkbox"
              role="switch"
              id="authToggle"
            />
          </div>
          <span class="toggle-label ms-3" id="lblRegister" style="color: #888;"
            >Registrarse</span
          >
        </div>
      </div>

      <!-- Tarjeta Split Principal -->
      <div class="auth-card-container">
        <div class="row g-0 auth-card">
          <!-- Columna Izquierda: Formularios -->
          <div class="col-lg-6 auth-form-side">
            <!-- VISTA LOGIN -->
            <div id="loginView">
              <div class="brand-header text-center mb-4">
                <h2>FormAI</h2>
                <span>FormAI</span>
              </div>

              <form id="loginForm" class="needs-validation" novalidate>
                <!-- Correo -->
                <div class="form-group mb-4">
                  <label for="loginEmail" class="form-label">
                    <i class="bi bi-envelope me-2"></i>Correo
                  </label>
                  <input
                    type="email"
                    class="form-control dark-input"
                    id="loginEmail"
                    placeholder="FormAI@gmail.com"
                    required
                  />
                  <div class="invalid-feedback">
                    Ingresa un correo válido.
                  </div>
                </div>

                <!-- Contraseña -->
                <div class="form-group mb-4">
                  <label for="loginPassword" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control dark-input"
                    id="loginPassword"
                    placeholder="************"
                    required
                  />
                  <div class="invalid-feedback">
                    Por favor escribe tu contraseña.
                  </div>
                </div>

                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-auth-submit w-100">
                    Login
                  </button>
                </div>
              </form>
            </div>

            <!-- VISTA REGISTRO (Oculta por defecto) -->
            <div id="registerView" style="display: none;">
              <div class="brand-header text-center mb-4">
                <h2>Crear Cuenta</h2>
                <span>FormAI</span>
              </div>

              <form id="registerForm" class="needs-validation" novalidate>
                <div class="form-group mb-3">
                  <label for="regNombre" class="form-label"
                    ><i class="bi bi-person me-2"></i>Nombre</label
                  >
                  <input
                    type="text"
                    class="form-control dark-input"
                    id="regNombre"
                    placeholder="Juan"
                    pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]{2,30}"
                    required
                  />
                </div>

                <div class="form-group mb-3">
                  <label for="regTelefono" class="form-label"
                    ><i class="bi bi-telephone me-2"></i>Teléfono</label
                  >
                  <input
                    type="tel"
                    class="form-control dark-input"
                    id="regTelefono"
                    placeholder="3001234567"
                    pattern="3[0-9]{9}"
                    required
                  />
                </div>

                <div class="form-group mb-3">
                  <label for="regEmail" class="form-label"
                    ><i class="bi bi-envelope me-2"></i>Correo
                    Electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control dark-input"
                    id="regEmail"
                    placeholder="FormAI@gmail.com"
                    required
                  />
                </div>

                <div class="form-group mb-3">
                  <label for="regPassword" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    class="form-control dark-input"
                    id="regPassword"
                    placeholder="************"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    required
                  />
                </div>

                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-auth-submit w-100">
                    Registrarse
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Columna Derecha: Ilustración Patrón -->
          <div
            class="col-lg-6 auth-image-side d-flex flex-column align-items-center justify-content-center"
          >
            <img
              src="patron.png"
              alt="Patrón Moldería FormAI"
              class="img-fluid pattern-img"
            />
            <h3 class="pattern-brand-title mt-3">FormAI</h3>
          </div>
        </div>
      </div>
    </main>

    <!-- Script de Switch y Validación en Tiempo Real -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const toggle = document.getElementById('authToggle');
        const loginView = document.getElementById('loginView');
        const registerView = document.getElementById('registerView');
        const lblLogin = document.getElementById('lblLogin');
        const lblRegister = document.getElementById('lblRegister');

        // 1. Lógica del Switch (Login / Registro)
        toggle.addEventListener('change', function () {
          if (this.checked) {
            // Activar Vista Registro
            loginView.style.display = 'none';
            registerView.style.display = 'block';
            lblRegister.style.color = '#fff';
            lblRegister.style.fontWeight = '600';
            lblLogin.style.color = '#888';
            lblLogin.style.fontWeight = 'normal';
          } else {
            // Activar Vista Login
            registerView.style.display = 'none';
            loginView.style.display = 'block';
            lblLogin.style.color = '#fff';
            lblLogin.style.fontWeight = '600';
            lblRegister.style.color = '#888';
            lblRegister.style.fontWeight = 'normal';
          }
        });

        // 2. Validación interactiva en tiempo real para ambos formularios
        const setupFormValidation = (formId) => {
          const form = document.getElementById(formId);
          const inputs = form.querySelectorAll('.form-control');

          function validarCampo(input) {
            if (input.checkValidity()) {
              input.classList.remove('is-invalid');
              input.classList.add('is-valid');
            } else {
              input.classList.remove('is-valid');
              input.classList.add('is-invalid');
            }
          }

          inputs.forEach((input) => {
            input.addEventListener('input', () => {
              if (input.value.trim() !== '') validarCampo(input);
              else input.classList.remove('is-valid', 'is-invalid');
            });

            input.addEventListener('blur', () => {
              if (input.value.trim() !== '' || input.hasAttribute('required')) {
                validarCampo(input);
              }
            });
          });

          form.addEventListener('submit', (e) => {
            inputs.forEach((i) => validarCampo(i));
            if (!form.checkValidity()) {
              e.preventDefault();
              e.stopPropagation();
            } else {
              e.preventDefault();
              const isReg = formId === 'registerForm';
              Swal.fire({
                title: isReg ? '¡Registro Exitoso!' : '¡Bienvenido!',
                text: isReg
                  ? 'Tu cuenta ha sido creada correctamente.'
                  : 'Has iniciado sesión con éxito.',
                icon: 'success',
                confirmButtonColor: '#336699',
                background: '#1a1a1a',
                color: '#fff',
              });
            }
          });
        };

        setupFormValidation('loginForm');
        setupFormValidation('registerForm');
      });
    </script>
  </body>
</html>
